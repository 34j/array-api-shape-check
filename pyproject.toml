[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "array-api-shape-check"
version = "0.1.3"
description = "Check shapes of input arrays easily"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=26.1",
  "more-itertools>=11.0.2",
  "numpy>=2.4.4",
  "types-array-api>=1.1.4",
]
urls."Bug Tracker" = "https://github.com/34j/array-api-shape-check/issues"
urls.Changelog = "https://github.com/34j/array-api-shape-check/blob/main/CHANGELOG.md"
urls.documentation = "https://array-api-shape-check.readthedocs.io"
urls.repository = "https://github.com/34j/array-api-shape-check"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
addopts = [
  "-v",
  "-Wonce",
  "-p no:doctest",
  "--cov=array_api_shape_check",
  "--cov-report=term",
  "--cov-report=xml",
]
pythonpath = [ "src" ]
